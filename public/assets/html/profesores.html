<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logoredu.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/1e87b3c56d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/estilo.css">
    <title>Profesores</title>
    <script src="../js/jwt-decode.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/shared.js"></script>
    <script type="module" src="../js/profesores.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
<div id="eliminarModal" class="modal-eliminar">
    <div class="modal-eliminar-content">
        <span class="eliminar-close">&times;</span>
        <h2>¿Estás seguro de eliminar este profesor?</h2>
        <div class="botones-modal-eliminar">
            <button id="btn-aceptar-eliminar">Aceptar</button>
            <button id="btn-cancelar-eliminar" class="cancelar-eliminar">Cancelar</button>
        </div>
    </div>
</div>

<div id="editarModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Editar Profesor</h2>
        <form id="editar-modal-form">
            <label for="editar-cedula">Cédula:</label>
            <input type="number" id="editar-cedula" name="editar-cedula" required>
            <label for="editar-apellidos">Apellidos:</label>
            <input type="text" id="editar-apellidos" name="editar-apellidos" required>
            <label for="editar-nombres">Nombres:</label>
            <input type="text" id="editar-nombres" name="editar-nombres" required>
            <label for="editar-tipo">Tipo:</label>
            <select id="editar-tipo" name="editar-tipo" required>
                <option value="normal">Profesor Normal</option>
                <option value="virtual">Profesor Virtual</option>
            </select>
            <label for="editar-estado">Estado:</label>
            <select id="editar-estado" name="editar-estado" required>
                <option value="activo">Activo</option>
                <option value="inactivo">Inactivo</option>
            </select>
            <button type="submit">Guardar Cambios</button>
            <button type="button" class="cancelar" id="cancelar-editar-modal">Cancelar</button>
        </form>
    </div>
</div>

    <h2 class="general-tittle2"><i class="fa-solid fa-chalkboard-user"></i>Profesores</h2>
    
    <div class="cabecera-crud-profesores">
        <button class="boton-crud-profesores">Filtrar</button>
        <button class="boton-crud-profesores" id="boton-crud-profesores">Ver Reporte</button>
    </div>
    
    <div class="filtros-busqueda-profesores oculto">
        <div class="contenedor-filtros-profesores">
            <input type="text" placeholder="Buscar" class="buscar-input-profesores">
            <select class="tipo-select">
                <option value="" disabled selected>Tipo</option>
                <option value="normal">Profesor Normal</option>
                <option value="virtual">Profesor Virtual</option>
            </select>
            <select class="estado-profesores-select">
                <option value="" disabled selected>Estado</option>
                <option value="activo">Activo</option>
                <option value="inactivo">Inactivo</option>
            </select>
        </div>
        <div class="botones-filtro-profesores">
            <button class="boton-filtro-profesores">Buscar</button>
            <button class="boton-filtro-profesores">Reajustar</button>
        </div>
    </div>
    
    <div class="crud-profesores">
        <main class="contenedor-principal-profesores">
            <table class="tabla-profesores" id="tabla-profesores">
                <thead>
                    <tr>
                        <th>Cédula</th>
                        <th>Apellidos</th>
                        <th>Nombres</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Telefono 1</th>
                        <th>Telefono 2</th>
                        <th>Correo</th>
                        <th>Codigo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                              <!-- Las filas se llenarán dinámicamente con JavaScript -->

                </tbody>
            </table>
        </main>
        <div class="paginacion-crud paginacion-profesores">
            <button class="pagina-anterior-profesores"><i class="fas fa-chevron-left"></i></button>
            <div class="numeros-pagina-profesores">
                <button class="numero-pagina-profesores activo">1</button>
                <button class="numero-pagina-profesores">2</button>
            </div>
            <button class="pagina-siguiente-profesores"><i class="fas fa-chevron-right"></i></button>
            <span class="info-paginacion-profesores">1-5 de 14</span>
        </div>
    </div>


</body>
</html>
