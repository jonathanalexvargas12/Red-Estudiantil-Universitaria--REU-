<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logoredu.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/1e87b3c56d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/estilo.css">
    <title>Inicio</title>
    <script src="../js/jwt-decode.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/shared.js"></script>
    <script type="module" src="../js/inicio.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container-panel">
        <h2 class="general-tittle"><i class="fa-solid fa-home"></i>Inicio</h2>

        <div class="dashboard-grid" id="dashboard-grid">
            <div class="dashboard-card" id="loading-card">
                <div class="card-icon"><i class="fas fa-spinner fa-spin"></i></div>
                <div class="card-value">—</div>
                <div class="card-label">Cargando...</div>
            </div>

            <a href="inscripciones-cobrar.html" id="card-inscripciones-cobrar" class="card">
                <div class="card-icon"><i class="fa-solid fa-credit-card"></i></div>
                <div class="card-title">Inscripciones por cobrar</div>
                <div class="card-count" id="card-inscripciones-cobrar-count">—</div>
            </a>
        </div>
    </div>

    <main class="principal-contenido">
        <section class="indicador-calificaciones">
            <h2 class="indicador-titulo"><i class="fas fa-tasks"></i> Asignaturas por Calificar <span class="indicador-contador" id="contador-calificaciones">—</span></h2>
            <div class="grafico-barras" id="grafico-calificaciones">
                <div class="barra-total"></div>
                <div class="barra-pendiente"></div>
            </div>
            <a href="../html/notas-por-calificar.html" class="boton-ver">Ver Asignaturas</a>
        </section>

        <section class="indicador-inscripciones-pendientes">
            <h2 class="indicador-titulo"><i class="fas fa-user-plus"></i> Inscripciones por Validar <span class="indicador-contador" id="contador-inscripciones-pendientes">—</span></h2>
            <div class="grafico-barras" id="grafico-inscripciones-pendientes">
                <div class="barra-total"></div>
                <div class="barra-pendiente"></div>
            </div>
            <a href="../html/inscripciones.html" class="boton-ver">Ver Inscripciones</a>
        </section>

        <section class="chart-section">
            <h3><i class="fas fa-users"></i> Estudiantes por Carrera</h3>
            <div class="bar-container" id="chart-estudiantes-carrera"></div>
        </section>

        <section class="chart-section sin-carrera-section">
            <h3><i class="fas fa-user-slash"></i> Estudiantes sin Carrera Asignada</h3>
            <div class="sin-carrera-container" id="chart-estudiantes-sin-carrera"></div>
        </section>
    </main>

</body>
</html>
