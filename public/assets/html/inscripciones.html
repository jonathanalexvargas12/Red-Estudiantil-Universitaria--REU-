<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logoredu.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/1e87b3c56d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/estilo.css">
    <title>Inscripciones</title>
    <script src="../js/jwt-decode.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/shared.js"></script>
    <script type="module" src="../js/inscripciones.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>
<body>
    <div id="header-placeholder"></div>
<h2 class="general-tittle2"><i class="fa-regular fa-calendar-check"></i>Inscripciones</h2>
    <div class="cabecera-crud">
        <button id="btn-agregar" class="boton-crud">Agregar</button>
        <button id="btn-filtrar" class="boton-crud">Filtrar</button>
        <button id="btn-reporte" class="boton-crud">Ver Reporte</button>
    </div>
    
    <div id="filtros-busqueda" class="filtros-busqueda oculto">
        <div class="contenedor-filtros">
            <input type="text" id="buscar-input" placeholder="Buscar" class="buscar-input">
           
            <select id="estado-select" class="estado-select">
                <option value="" disabled selected>Estado</option>
                <option value="activo">Validado</option>
                <option value="rechazado">Rechazado</option>
                <option value="inactivo">Por Validar</option>
            </select>
            <select id="pago-select" class="pago-select">
                <option value="" disabled selected>Pago</option>
                <option value="">Todos</option>
                <option value="realizado">Realizado</option>
                <option value="pendiente">Pendiente</option>
            </select>
        </div>
        <div class="botones-filtro">
            <button class="boton-filtro">Buscar</button>
            <button id="btn-reajustar" class="boton-filtro">Reajustar</button>
        </div>
    </div>
    </div>

   <div id="agregarModal" class="modal">
    <div class="agregar-modal-content">
        <span class="agregar-close">&times;</span>
        <h2>Agregar Inscripción</h2>
        <form id="agregar-modal-form">
            <label for="nueva-cedula">Cédula Estudiante:</label>
            <input type="number" id="nueva-cedula" name="nueva-cedula" required>
            
            <label for="nuevo-estado">Estado:</label>
            <select id="nuevo-estado" name="nuevo-estado" required>
                <option value="activo">Activo</option>
                <option value="inactivo">Inactivo</option>
                <option value="rechazado">Rechazado</option>
            </select>
            
            <label for="nuevo-periodo">Periodo Académico:</label>
            <select id="nuevo-periodo" name="nuevo-periodo" required>
                <option value="">Cargando periodos...</option>
            </select>
            
            <label for="nueva-carrera">Carrera:</label>
            <select id="nueva-carrera" name="nueva-carrera" required>
                <option value="">Cargando carreras...</option>
            </select>
            
            <label for="nuevo-nivel-pensum">Nivel Pensum:</label>
            <select id="nuevo-nivel-pensum" name="nuevo-nivel-pensum" required>
                <option value="Primer Año">Primer Año</option>
                <option value="Segundo Año">Segundo Año</option>
                <option value="Tercer Año">Tercer Año</option>
                <option value="Cuarto Año">Cuarto Año</option>
                <option value="Quinto Año">Quinto Año</option>
            </select>
            
            <label for="nuevo-turno">Turno:</label>
            <select id="nuevo-turno" name="nuevo-turno" required>
                <option value="Mañana">Mañana</option>
                <option value="Tarde">Tarde</option>
                <option value="Noche">Noche</option>
                <option value="Fin de Semana">Fin de Semana</option>
            </select>
            
            <label for="nuevo-pago">Pago:</label>
            <select id="nuevo-pago" name="nuevo-pago" required>
                <option value="realizado">Realizado</option>
                <option value="pendiente">Pendiente</option>
            </select>
            
            <label for="nuevo-monto-pago">Monto de Pago:</label>
            <input type="number" id="nuevo-monto-pago" name="nuevo-monto-pago" step="0.01">
            
            <label for="nueva-moneda">Moneda:</label>
            <select id="nueva-moneda" name="nueva-moneda">
                <option value="Bs">Bs</option>
                <option value="USD">USD</option>
            </select>
            
            <label for="nueva-modalidad-pago">Modalidad de Pago:</label>
            <select id="nueva-modalidad-pago" name="nueva-modalidad-pago">
                <option value="Pago Movil">Pago Móvil</option>
                <option value="Transferencia">Transferencia</option>
                <option value="Efectivo">Efectivo</option>
            </select>
            
            <label for="nueva-entidad-bancaria">Entidad Bancaria:</label>
            <select id="nueva-entidad-bancaria" name="nueva-entidad-bancaria">
                <option value="">Seleccione un banco</option>
                <option value="0001 - Banco Central de Venezuela (BCV)">0001 - Banco Central de Venezuela (BCV)</option>
                <option value="0102 - Banco de Venezuela, S.A. Banco Universal">0102 - Banco de Venezuela, S.A. Banco Universal</option>
                <option value="0104 - Banco Venezolano de Crédito, S.A. Banco Universal">0104 - Banco Venezolano de Crédito, S.A. Banco Universal</option>
                <option value="0105 - Banco Mercantil, C.A. Banco Universal">0105 - Banco Mercantil, C.A. Banco Universal</option>
                <option value="0108 - Banco Provincial, S.A. Banco Universal (BBVA)">0108 - Banco Provincial, S.A. Banco Universal (BBVA)</option>
                <option value="0114 - Bancaribe, C.A. Banco Universal">0114 - Bancaribe, C.A. Banco Universal</option>
                <option value="0115 - Banco Exterior, C.A. Banco Universal">0115 - Banco Exterior, C.A. Banco Universal</option>
                <option value="0128 - Banco Caroní, C.A. Banco Universal">0128 - Banco Caroní, C.A. Banco Universal</option>
                <option value="0134 - Banesco Banco Universal, C.A.">0134 - Banesco Banco Universal, C.A.</option>
                <option value="0137 - Banco Sofitasa, Banco Universal, C.A.">0137 - Banco Sofitasa, Banco Universal, C.A.</option>
                <option value="0138 - Banco Plaza, Banco Universal">0138 - Banco Plaza, Banco Universal</option>
                <option value="0146 - Bangente, C.A. (Banco de la Gente Emprendedora)">0146 - Bangente, C.A. (Banco de la Gente Emprendedora)</option>
                <option value="0151 - BFC Banco Fondo Común, C.A. Banco Universal">0151 - BFC Banco Fondo Común, C.A. Banco Universal</option>
                <option value="0156 - 100% Banco, Banco Universal, C.A.">0156 - 100% Banco, Banco Universal, C.A.</option>
                <option value="0157 - Delsur, Banco Universal, C.A.">0157 - Delsur, Banco Universal, C.A.</option>
                <option value="0163 - Banco del Tesoro, C.A. Banco Universal">0163 - Banco del Tesoro, C.A. Banco Universal</option>
                <option value="0166 - Banco Agrícola de Venezuela, C.A. Banco Universal">0166 - Banco Agrícola de Venezuela, C.A. Banco Universal</option>
                <option value="0168 - Bancrecer, S.A. Banco Microfinanciero">0168 - Bancrecer, S.A. Banco Microfinanciero</option>
                <option value="0169 - R4 Banco Microfinanciero, C.A. (Anteriormente Mi Banco)">0169 - R4 Banco Microfinanciero, C.A. (Anteriormente Mi Banco)</option>
                <option value="0171 - Banco Activo, C.A. Banco Universal">0171 - Banco Activo, C.A. Banco Universal</option>
                <option value="0172 - Bancamiga Banco Universal, C.A.">0172 - Bancamiga Banco Universal, C.A.</option>
                <option value="0173 - Banco Internacional de Desarrollo, C.A. Banco Universal">0173 - Banco Internacional de Desarrollo, C.A. Banco Universal</option>
                <option value="0174 - Banplus Banco Universal, C.A.">0174 - Banplus Banco Universal, C.A.</option>
                <option value="0175 - Banco Digital de los Trabajadores, B.U.">0175 - Banco Digital de los Trabajadores, B.U.</option>
                <option value="0177 - BANFANB (Banco de la Fuerza Armada Nacional Bolivariana)">0177 - BANFANB (Banco de la Fuerza Armada Nacional Bolivariana)</option>
                <option value="0178 - N58 Banco Digital, Banco Microfinanciero, S.A.">0178 - N58 Banco Digital, Banco Microfinanciero, S.A.</option>
                <option value="0191 - Banco Nacional de Crédito, BNC, C.A. Banco Universal">0191 - Banco Nacional de Crédito, BNC, C.A. Banco Universal</option>
                <option value="0601 - Instituto Municipal de Crédito Popular (IMCP)">0601 - Instituto Municipal de Crédito Popular (IMCP)</option>
            </select>
            
            <label for="nuevo-numero-transferencia">Número de Transferencia/Referencia:</label>
            <input type="text" id="nuevo-numero-transferencia" name="nuevo-numero-transferencia">
            
            <label for="nueva-fecha-pago">Fecha de Pago:</label>
            <input type="date" id="nueva-fecha-pago" name="nueva-fecha-pago">
            
            <label for="nueva-fecha-registro">Fecha de Registro:</label>
            <input type="date" id="nueva-fecha-registro" name="nueva-fecha-registro" required>
            
            <button type="submit">Guardar</button>
            <button type="button" class="cancelar-agregar" id="cancelar-agregar-modal">Cancelar</button>
        </form>
    </div>
</div>
    
    <div id="materiasModal" class="modal">
        <div class="modal-content">
            <span class="close-materias">&times;</span>
            <h2>Seleccionar Materias</h2>
            <p><strong>Estudiante:</strong> <span id="materias-estudiante"></span></p>
            <p><strong>Cédula:</strong> <span id="materias-cedula"></span></p>
            <p><strong>Periodo:</strong> <span id="materias-periodo"></span></p>
            <p><strong>Carrera:</strong> <span id="materias-carrera"></span></p>
            <div id="materias-lista" style="max-height:300px;overflow-y:auto;margin:10px 0;border:1px solid #ccc;padding:10px;">
                <p>Cargando materias disponibles...</p>
            </div>
            <button id="btn-confirmar-materias" class="boton-crud" style="margin-right:10px;">Confirmar Inscripción</button>
            <button id="btn-saltar-materias" class="boton-filtro">Solo Inscripción (sin materias)</button>
        </div>
    </div>

    <div id="modalAnular" class="modal-anular">
        <div class="modal-anular-content">
            <span class="close-anular">&times;</span>
            <h2>¿Estás seguro de anular este registro?</h2>
            <div class="botones-modal-anular">
                <button id="btn-aceptar-anular">Aceptar</button>
                <button id="btn-cancelar-anular" class="cancelar-anular">Cancelar</button>
            </div>
        </div>
    </div>

</div>
    
    <div class="crud-inscripciones">
        <main class="contenedor-principal-crud">
            <table id="tabla-inscripciones" class="tabla-crud">
                <thead>

                    <tr>

                        <th>Cédula</th>
                        <th>Carrera</th>
                        <th>Periodo</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Pago</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>

                   
                </tbody>
            </table>
        </main>
        <div class="paginacion-crud">
            <button class="pagina-anterior"><i class="fas fa-chevron-left"></i></button>
            <div class="numeros-pagina">
                <button class="numero-pagina activo">1</button>
                <button class="numero-pagina">2</button>
                </div>
            <button class="pagina-siguiente"><i class="fas fa-chevron-right"></i></button>
            <span class="info-paginacion">1-5 de 14</span>
        </div>
    </div>

    </div>



</body>
</html>
