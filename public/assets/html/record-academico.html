<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logoredu.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/1e87b3c56d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/estilo.css">
    <title>Record Académico</title>
    <script src="../js/jwt-decode.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/shared.js"></script>
     <script type="module" src="../js/record-academico.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
<h2 class="general-tittle2"><i class="fa-regular fa-address-book"></i>Récord Académico</h2>


<div class="filtros-busqueda-record">
    <div class="contenedor-filtros-record">
        <input type="text" class="buscar-input-record" placeholder="Buscar Récord Académico">
    </div>
    <div class="botones-filtro-record">
        <button class="boton-filtro-record btn-buscar-record">Buscar</button>
        <button class="boton-filtro-record btn-reajustar-record">Reajustar</button>
    </div>
</div>

<div class="crud-record">
    <main class="crud-record-contenedor">
        <table id="tabla-record" class="tabla-record-academico" data-table-type="record-academico">
            <thead>
                <tr>
                    <th>Cédula</th>
                    <th>Estudiante</th>
                    <th>Cantidad Registros</th>
                    
                </tr>
            </thead>
            <tbody>
            <!-- Las filas se llenarán dinámicamente con JavaScript -->
            </tbody>
        </table>
    </main>

    <div class="paginacion-crud paginacion-record">
        <button class="pagina-anterior-record"><i class="fas fa-chevron-left"></i></button>
        <div class="numeros-pagina-record">
            <button class="numero-pagina-record activo">1</button>
            <button class="numero-pagina-record">2</button>
        </div>
        <button class="pagina-siguiente-record"><i class="fas fa-chevron-right"></i></button>
        <span class="info-paginacion-record">1-3 de 3</span>
    </div>
</div>

</body>
</html>
