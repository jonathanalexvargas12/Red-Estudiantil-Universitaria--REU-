<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logoredu.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/1e87b3c56d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/estilo.css">
    <title>Retiro de Materias</title>
    <script src="../js/jwt-decode.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/shared.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container-panel">
        <h2 class="general-tittle"><i class="fa-solid fa-book"></i> Retiro de Materias</h2>

        <div class="busqueda-container" style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
            <input type="text" id="buscar-cedula" class="input-recuperacion" placeholder="Buscar por cédula del estudiante" style="flex:1;min-width:200px;">
            <select id="buscar-periodo" class="input-recuperacion" style="min-width:160px;">
                <option value="">Todos los períodos</option>
            </select>
            <button id="btn-buscar-retiro" class="login-button" style="padding:8px 20px;"><i class="fas fa-search"></i> Buscar</button>
        </div>

        <div id="tabla-retiro-container">
            <p style="color:#888;">Ingrese una cédula y presione Buscar.</p>
        </div>
    </div>

    <script src="../js/retiro-materias.js"></script>
</body>
</html>
