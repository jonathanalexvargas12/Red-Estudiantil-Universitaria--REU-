<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logoredu.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/1e87b3c56d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/estilo.css">
    <title>Secciones</title>
    <script src="../js/jwt-decode.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/shared.js"></script>
    <script type="module" src="../js/secciones.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
<div id="agregarSeccionModal" class="modal">
    <div class="agregar-modal-content">
        <span class="agregar-close"></span>
        <h2>Agregar Nueva Sección</h2>
        <form id="agregar-seccion-modal-form">
            <label for="agregar-nombre-seccion">Nombre de la Sección:</label>
            <input type="text" id="agregar-nombre-seccion" name="agregar-nombre-seccion" required>

            <button type="submit">Agregar Sección</button>
            <button type="button" class="cancelar-agregar" id="cancelar-agregar-seccion-modal">Cancelar</button>
        </form>
    </div>
</div>


<div id="eliminarSeccionModal" class="modal">
    <div class="modal-content">
        <span class="eliminar-close">&times;</span>
        <h2>¿Estás seguro de eliminar esta sección?</h2>
        <div class="botones-modal-eliminar">
            <button id="btn-aceptar-eliminar-seccion">Aceptar</button>
            <button id="btn-cancelar-eliminar-seccion">Cancelar</button>
        </div>
    </div>
</div>

    <h2 class="general-tittle2"><i class="fa-solid fa-arrow-down-a-z"></i>Secciones</h2>

    <div class="cabecera-crud-secciones">
        <button id="btn-agregar-seccion" class="boton-crud-secciones">Agregar Sección</button>
    </div>
    
    <div class="filtros-busqueda-secciones">
        <div class="contenedor-filtros-secciones">
            <input type="text" class="buscar-input-secciones" placeholder="Buscar Secciones">
        </div>
        <div class="botones-filtro-secciones">
            <button class="boton-filtro-secciones btn-buscar-secciones">Buscar</button>
            <button class="boton-filtro-secciones btn-reajustar-secciones">Reajustar</button>
        </div>
    </div>
    
    <div class="crud-secciones">
        <main class="crud-secciones-contenedor">
            <table id="tabla-secciones">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                <!-- Las filas se llenarán dinámicamente con JavaScript -->

                </tbody>
            </table>
        </main>
    
        <div class="paginacion-crud paginacion-secciones">
            <button class="pagina-anterior-secciones"><i class="fas fa-chevron-left"></i></button>
            <div class="numeros-pagina-secciones">
                <button class="numero-pagina-secciones activo">1</button>
                <button class="numero-pagina-secciones">2</button>
            </div>
            <button class="pagina-siguiente-secciones"><i class="fas fa-chevron-right"></i></button>
            <span class="info-paginacion-secciones">1-3 de 3</span>
        </div>
    </div>
   

</body>
</html>
