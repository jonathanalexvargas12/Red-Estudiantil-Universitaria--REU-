<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logoredu.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/1e87b3c56d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/estilo.css">
    <title>Calificaciones Docentes</title>
   <script src="../js/jwt-decode.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/shared.js"></script>
    <script type="module" src="../js/calif-docente.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
<div id="eliminarModal" class="modal-eliminar">
    <div class="modal-eliminar-content">
        <span class="eliminar-close">&times;</span>
        <h2>¿Estás seguro de eliminar esta calificación?</h2>
        <div class="botones-modal-eliminar">
            <button id="btn-aceptar-eliminar">Aceptar</button>
            <button id="btn-cancelar-eliminar" class="cancelar-eliminar">Cancelar</button>
        </div>
    </div>
</div>

<div id="editarModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Editar Calificación</h2>
        <form id="editar-modal-form">
            <label for="editar-periodo">Periodo:</label>
            <select id="editar-periodo" name="editar-periodo" required>
                <option value="" disabled selected>Seleccione periodo</option>
            </select>
            <label for="editar-asignatura">Asignatura:</label>
            <select id="editar-asignatura" name="editar-asignatura" required>
                <option value="" disabled selected>Seleccione asignatura</option>
            </select>
            <label for="editar-seccion">Sección:</label>
            <select id="editar-seccion" name="editar-seccion" required>
                <option value="" disabled selected>Seleccione sección</option>
            </select>
            <label for="editar-profesor">Profesor:</label>
            <input type="text" id="editar-profesor" name="editar-profesor" required>
            <label for="editar-estudiante">Estudiante:</label>
            <input type="text" id="editar-estudiante" name="editar-estudiante" required>
            <label for="editar-nota">Nota:</label>
            <input type="number" id="editar-nota" name="editar-nota" step="0.01" required>
            <button type="submit">Guardar Cambios</button>
            <button type="button" class="cancelar" id="cancelar-editar-modal">Cancelar</button>
        </form>
    </div>
</div>

<h2 class="general-tittle2"><i class="fa-solid fa-user-plus"></i>Calificaciones Docentes</h2>

<div class="cabecera-crud-calificaciones">
    <button class="boton-crud-calificaciones">Filtrar</button>
    <button class="boton-crud-calificaciones">Ver Reporte</button>
</div>

<div class="filtros-busqueda-calificaciones oculto">
    <div class="contenedor-filtros-calificaciones">
        <input type="text" placeholder="Buscar" class="buscar-input-calificaciones">
        <select class="periodo-select" id="periodo-select">
            <option value="" disabled selected>Periodo</option>
        </select>
        <select class="asignatura-select" id="asignatura-select"
            <option value="" disabled selected>Asignatura</option>
        </select>
    </div>
    <div class="botones-filtro-calificaciones">
        <button class="boton-filtro-calificaciones">Buscar</button>
        <button class="boton-filtro-calificaciones">Reajustar</button>
    </div>
</div>
    
    <div class="crud-calificaciones">
        <main class="contenedor-principal-calificaciones">
            <table class="tabla-calificaciones" id="tabla-calificaciones">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Periodo</th>
                        <th>Asignatura</th>
                        <th>Sección</th>
                        <th>Profesor</th>
                        <th>Estudiante</th>
                        <th>Nota</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </main>
        <div class="paginacion-crud paginacion-calificaciones">
            <button class="pagina-anterior-calificaciones"><i class="fas fa-chevron-left"></i></button>
            <div class="numeros-pagina-calificaciones">
                <button class="numero-pagina-calificaciones activo">1</button>
                <button class="numero-pagina-calificaciones">2</button>
            </div>
            <button class="pagina-siguiente-calificaciones"><i class="fas fa-chevron-right"></i></button>
            <span class="info-paginacion-calificaciones">1-5 de 14</span>
        </div>
    </div>

    
</body>
</html>
