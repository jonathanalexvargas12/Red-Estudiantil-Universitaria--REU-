<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logoredu.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/1e87b3c56d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/estilo.css">
    <title>Carreras</title>
    <script src="../js/jwt-decode.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/shared.js"></script>
    <script type="module" src="../js/carreras.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
<div id="agregarCarreraModal" class="modal">
        <div class="agregar-modal-content">
            <span class="agregar-close"></span>
            <h2>Agregar Nueva Carrera</h2>
            <form id="agregar-carrera-modal-form">
                <div class="form-group">
                    <label for="agregar-codigo-carrera">Código:</label>
                    <input type="text" id="agregar-codigo-carrera" name="agregar-codigo-carrera" required>
                </div>
    
                <div class="form-group">
                    <label for="agregar-nombre-carrera">Nombre de la Carrera:</label>
                    <input type="text" id="agregar-nombre-carrera" name="agregar-nombre-carrera" required>
                </div>
    
                <div class="form-group">
                    <label for="agregar-tipo-carrera">Tipo:</label>
                    <select id="agregar-tipo-carrera" name="agregar-tipo-carrera" required>
                        <option value="" disabled>Elija el tipo</option>
                        <option value="Trimestral">Trimestral</option>
                        <option value="Semestral">Semestral</option>
                    </select>
                </div>
    
                <div class="form-group">
                    <label for="agregar-estado-carrera">Estado:</label>
                    <select id="agregar-estado-carrera" name="agregar-estado-carrera" required>
                        <option value="" disabled>Elija el estado</option>
                        <option value="Activa">Activa</option>
                        <option value="Inactiva">Inactiva</option>
                    </select>
                </div>
    
                <div class="form-group">
                    <label for="agregar-total-uc-carrera">Total UC:</label>
                    <input type="number" id="agregar-total-uc-carrera" name="agregar-total-uc-carrera" min="0" required>
                </div>
    
                <div class="form-buttons">
                    <button type="submit" class="btn-primary">Agregar Carrera</button>
                    <button type="button" class="btn-secondary cancelar-agregar" id="cancelar-agregar-carrera-modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="editarCarreraModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Editar Carrera</h2>
            <form id="editar-carrera-modal-form">
                <div class="form-group">
                    <label for="editar-codigo-carrera">Código:</label>
                    <input type="text" id="editar-codigo-carrera" name="editar-codigo-carrera" required>
                </div>
    
                <div class="form-group">
                    <label for="editar-nombre-carrera">Nombre de la Carrera:</label>
                    <input type="text" id="editar-nombre-carrera" name="editar-nombre-carrera" required>
                </div>
    
                <div class="form-group">
                    <label for="editar-tipo-carrera">Tipo:</label>
                    <select id="editar-tipo-carrera" name="editar-tipo-carrera" required>
                        <option value="" disabled>Elija el tipo</option>
                        <option value="Trimestral">Trimestral</option>
                        <option value="Semestral">Semestral</option>
                    </select>
                </div>
    
                <div class="form-group">
                    <label for="editar-estado-carrera">Estado:</label>
                    <select id="editar-estado-carrera" name="editar-estado-carrera" required>
                        <option value="" disabled>Elija el estado</option>
                        <option value="Activa">Activa</option>
                        <option value="Inactiva">Inactiva</option>
                    </select>
                </div>
    
                <div class="form-group">
                    <label for="editar-total-uc-carrera">Total UC:</label>
                    <input type="number" id="editar-total-uc-carrera" name="editar-total-uc-carrera" min="0" required>
                </div>
    
                <div class="form-buttons">
                    <button type="submit" class="btn-primary">Guardar Cambios</button>
                    <button type="button" class="btn-secondary cancelar" id="cancelar-editar-carrera-modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

<div id="eliminarCarreraModal" class="modal">
    <div class="modal-content">
        <span class="eliminar-close">&times;</span>
        <h2>¿Estás seguro de eliminar esta carrera?</h2>
        <div class="botones-modal-eliminar">
            <button id="btn-aceptar-eliminar-carrera">Aceptar</button>
            <button id="btn-cancelar-eliminar-carrera">Cancelar</button>
        </div>
    </div>
</div>

    <h2 class="general-tittle2"><i class="fas fa-graduation-cap"></i>Carreras</h2>

<div class="cabecera-crud-carreras">
    <button id="btn-agregar-carrera" class="boton-crud-carreras">Agregar Carrera</button>
</div>

<div class="filtros-busqueda-carreras">
    <div class="contenedor-filtros-carreras">
        <input type="text" class="buscar-input-carreras" placeholder="Buscar Carreras">
        </div>
    <div class="botones-filtro-carreras">
        <button class="boton-filtro-carreras btn-buscar-carreras">Buscar</button>
        <button class="boton-filtro-carreras btn-reajustar-carreras">Reajustar</button>
    </div>
</div>

<div class="crud-carreras">
    <main class="crud-carreras-contenedor">
        <table id="tabla-carreras">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Carrera</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
           <!-- Las filas se llenarán dinámicamente con JavaScript -->


            </tbody>
        </table>
    </main>

    <div class="paginacion-crud paginacion-carreras">
        <button class="pagina-anterior-carreras"><i class="fas fa-chevron-left"></i></button>
        <div class="numeros-pagina-carreras">
            <button class="numero-pagina-carreras activo">1</button>
            <button class="numero-pagina-carreras">2</button>
        </div>
        <button class="pagina-siguiente-carreras"><i class="fas fa-chevron-right"></i></button>
        <span class="info-paginacion-carreras">1-5 de 14</span>
    </div>
</div>
    

</body>
</html>
