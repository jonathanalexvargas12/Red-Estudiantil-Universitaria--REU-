<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logoredu.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/1e87b3c56d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/estilo.css">
    <title>Reinscripcion Academica</title>
    <script src="../js/jwt-decode.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/shared.js"></script>
    <script type="module" src="../js/reinscripcion.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
<div class="contenedor-mis-datos">
    <div class="contenedor-mis-datos__titulo">
        <i class="fa-solid fa-user-graduate"></i> 
        <h2>Reinscripción Académica</h2>
    </div>
    
    <div>
        <div class="contenedor-mis-datos__form-group">
            <label for="cedula" class="contenedor-mis-datos__label">Cédula:</label>
            <input type="text" id="cedula" class="contenedor-mis-datos__input" readonly value="00000000">
        </div>
    
        <div class="contenedor-mis-datos__form-group">
            <label for="nombres" class="contenedor-mis-datos__label">Nombres:</label>
            <input type="text" id="nombres" class="contenedor-mis-datos__input" readonly value="Nombre Ejemplo">
        </div>
    
        <div class="contenedor-mis-datos__form-group">
            <label for="apellidos" class="contenedor-mis-datos__label">Apellidos:</label>
            <input type="text" id="apellidos" class="contenedor-mis-datos__input" readonly value="Apellido Ejemplo">
        </div>
    
        <div class="contenedor-mis-datos__form-group">
            <label for="direccion" class="contenedor-mis-datos__label">Dirección:</label>
            <input type="text" id="direccion" class="contenedor-mis-datos__input" readonly value="Caracas">
        </div>
    
        <div class="contenedor-mis-datos__form-group">
            <label for="telefono1" class="contenedor-mis-datos__label">Teléfono 1:</label>
            <input type="text" id="telefono1" class="contenedor-mis-datos__input" readonly value="(0412) 0000000">
        </div>
    
        <div class="contenedor-mis-datos__form-group">
            <label for="telefono2" class="contenedor-mis-datos__label">Teléfono 2:</label>
            <input type="text" id="telefono2" class="contenedor-mis-datos__input" readonly value="(0424) 0000000">
        </div>
    
        <div class="contenedor-mis-datos__form-group">
            <label for="correo" class="contenedor-mis-datos__label">Correo:</label>
            <input type="email" id="correo" class="contenedor-mis-datos__input" readonly value="email@example.com">
        </div>
    
        <div class="contenedor-mis-datos__form-group">
            <label for="usuario" class="contenedor-mis-datos__label">Usuario:</label>
            <input type="text" id="usuario" class="contenedor-mis-datos__input" readonly value="usuario123">
        </div>
        
        <!-- Campos de reinscripción -->
        <div class="contenedor-mis-datos__form-group">
            <label for="carrera" class="contenedor-mis-datos__label">Carrera:</label>
            <select id="carrera" class="contenedor-mis-datos__input" required>
                <option value="">Seleccione una carrera</option>
                <option value="1">Ingeniería en Sistemas</option>
                <option value="2">Administración de Empresas</option>
                <option value="3">Derecho</option>
                <option value="4">Medicina</option>
                <option value="5">Psicología</option>
            </select>
        </div>
        
        <div class="contenedor-mis-datos__form-group">
            <label for="periodo" class="contenedor-mis-datos__label">Período Académico:</label>
            <select id="periodo" class="contenedor-mis-datos__input" required>
                <option value="">Seleccione un período</option>
                <option value="2023-1">Enero-Abril 2023</option>
                <option value="2023-2">Mayo-Agosto 2023</option>
                <option value="2023-3">Septiembre-Diciembre 2023</option>
            </select>
        </div>

            <div class="contenedor-mis-datos__form-group">
            <label for="turno" class="contenedor-mis-datos__label">Turno:</label>
            <select id="turno" class="contenedor-mis-datos__input" required>
                <option value="">Seleccione un Turno</option>
                <option value="matutino">Matutino</option>
                <option value="vespertino">Vespertino</option>
                <option value="nocturno">Nocturno</option>
            </select>
        </div>

         <div class="contenedor-mis-datos__form-group">
            <label for="nivel-pensum" class="contenedor-mis-datos__label">Nivel Pensum:</label>
            <select id="nivel-pensum" class="contenedor-mis-datos__input" required>
                <option value="">Seleccione un Nivel</option>
                <option value="1">Primero</option>
                <option value="2">Segundo</option>
                <option value="3">Tercero</option>
            </select>
        </div>
        
        <div class="contenedor-mis-datos__form-group">
            <label style="font-weight:bold;margin-top:15px;">Materias Disponibles:</label>
            <div id="materias-reinscripcion" style="max-height:250px;overflow-y:auto;border:1px solid #ccc;padding:10px;margin-top:5px;border-radius:4px;">
                <p style="color:#888;">Seleccione un período y carrera para ver materias disponibles.</p>
            </div>
        </div>

        <div class="contenedor-mis-datos__form-group">
            <button type="submit" class="contenedor-mis-datos__button">
                <i class="fa-solid fa-paper-plane"></i> Enviar Reinscripción
            </button>
        </div>
    </div>
</div>


</body>
</html>
