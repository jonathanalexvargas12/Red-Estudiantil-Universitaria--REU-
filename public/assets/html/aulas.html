<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logoredu.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/1e87b3c56d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/estilo.css">
    <title>Aulas</title>
    <script src="../js/jwt-decode.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/shared.js"></script>
    <script type="module" src="../js/aulas.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
<div id="agregarAulaModal" class="modal">
    <div class="agregar-modal-content">
        <span class="agregar-close">×</span>
        <h2>Agregar Nueva Aula</h2>
        <form id="agregar-aula-modal-form">
            <label for="agregar-nombre-aula">Nombre del Aula:</label>
            <input type="text" id="agregar-nombre-aula" name="agregar-nombre-aula" required>

            <label for="agregar-capacidad-aula">Capacidad de Alumnos:</label>
            <input type="number" id="agregar-capacidad-aula" name="agregar-capacidad-aula" required>

            <button type="submit">Agregar Aula</button>
            <button type="button" class="cancelar-agregar" id="cancelar-agregar-aula-modal">Cancelar</button>
        </form>
    </div>
</div>

<div id="editarAulaModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Editar Aula</h2>
        <form id="editar-aula-modal-form">
            <label for="editar-nombre-aula">Nombre del Aula:</label>
            <input type="text" id="editar-nombre-aula" name="editar-nombre-aula" required>

            <label for="editar-capacidad-aula">Capacidad de Alumnos:</label>
            <input type="number" id="editar-capacidad-aula" name="editar-capacidad-aula" required>

            <button type="submit">Guardar Cambios</button>
            <button type="button" class="cancelar" id="cancelar-editar-aula-modal">Cancelar</button>
        </form>
    </div>
</div>

<div id="eliminarAulaModal" class="modal">
    <div class="modal-content">
        <span class="eliminar-close">&times;</span>
        <h2>¿Estás seguro de eliminar esta aula?</h2>
        <div class="botones-modal-eliminar">
            <button id="btn-aceptar-eliminar-aula">Aceptar</button>
            <button id="btn-cancelar-eliminar-aula">Cancelar</button>
        </div>
    </div>
</div>

    <h2 class="general-tittle2"><i class="fa-solid fa-shop"></i>Aulas</h2>

    <div class="cabecera-crud-aulas">
        <button id="btn-agregar-aula" class="boton-crud-aulas">Agregar Aula</button>
    </div>
    
    <div class="filtros-busqueda-aulas">
        <div class="contenedor-filtros-aulas">
            <input type="text" class="buscar-input-aulas" placeholder="Buscar Aulas">
        </div>
        <div class="botones-filtro-aulas">
            <button class="boton-filtro-aulas btn-buscar-aulas">Buscar</button>
            <button class="boton-filtro-aulas btn-reajustar-aulas">Reajustar</button>
        </div>
    </div>
    
    <div class="crud-aulas">
        <main class="crud-aulas-contenedor">
            <table id="tabla-aulas">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Capacidad de Alumnos</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                <!-- Las filas se llenarán dinámicamente con JavaScript -->
 
                </tbody>
            </table>
        </main>
    
        <div class="paginacion-crud paginacion-aulas">
            <button class="pagina-anterior-aulas"><i class="fas fa-chevron-left"></i></button>
            <div class="numeros-pagina-aulas">
                <button class="numero-pagina-aulas activo">1</button>
                <button class="numero-pagina-aulas">2</button>
            </div>
            <button class="pagina-siguiente-aulas"><i class="fas fa-chevron-right"></i></button>
            <span class="info-paginacion-aulas">1-3 de 3</span>
        </div>
    </div>

</body>
</html>
