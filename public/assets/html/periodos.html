<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logoredu.ico" type="image/x-icon">
    <script src="https://kit.fontawesome.com/1e87b3c56d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/estilo.css">
    <title>Periodos</title>
    <script src="../js/jwt-decode.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/shared.js"></script>
    <script type="module" src="../js/periodos.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
<div id="agregarPeriodoModal" class="modal">
    <div class="agregar-modal-content">
        <span class="agregar-close">×</span>
        <h2>Agregar Nuevo Periodo</h2>
        <form id="agregar-periodo-modal-form">
            <label for="agregar-nombre-periodo">Nombre del Periodo:</label>
            <input type="text" id="agregar-nombre-periodo" name="agregar-nombre-periodo" required>

            <label for="agregar-limite-uc">Límite de UC:</label>
            <input type="number" id="agregar-limite-uc" name="agregar-limite-uc" required>

            <label for="agregar-fecha-inicio">Fecha de Inicio:</label>
            <input type="date" id="agregar-fecha-inicio" name="agregar-fecha-inicio" required>

            <label for="agregar-fecha-fin">Fecha de Finalización:</label>
            <input type="date" id="agregar-fecha-fin" name="agregar-fecha-fin" required>

            <label for="agregar-estatus">Estatus:</label>
            <select id="agregar-estatus" name="agregar-estatus" required>
                <option value="cursando">Cursando</option>
                <option value="cerrado">Cerrado</option>
            </select>

            <button type="submit">Agregar Periodo</button>
            <button type="button" class="cancelar-agregar" id="cancelar-agregar-periodo-modal">Cancelar</button>
        </form>
    </div>
</div>

<div id="editarPeriodoModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Editar Periodo</h2>
        <form id="editar-periodo-modal-form">
            <label for="editar-nombre-periodo">Nombre del Periodo:</label>
            <input type="text" id="editar-nombre-periodo" name="editar-nombre-periodo" required>

            <label for="editar-limite-uc">Límite de UC:</label>
            <input type="number" id="editar-limite-uc" name="editar-limite-uc" required>

            <label for="editar-fecha-inicio">Fecha de Inicio:</label>
            <input type="date" id="editar-fecha-inicio" name="editar-fecha-inicio" required>

            <label for="editar-fecha-fin">Fecha de Finalización:</label>
            <input type="date" id="editar-fecha-fin" name="editar-fecha-fin" required>

            <label for="editar-estatus">Estatus:</label>
            <select id="editar-estatus" name="editar-estatus" required>
                <option value="cursando">Cursando</option>
                <option value="cerrado">Cerrado</option>
            </select>

            <button type="submit">Guardar Cambios</button>
            <button type="button" class="cancelar" id="cancelar-editar-periodo-modal">Cancelar</button>
        </form>
    </div>
</div>

<div id="eliminarPeriodoModal" class="modal">
    <div class="modal-content">
        <span class="eliminar-close">&times;</span>
        <h2>¿Estás seguro de eliminar este periodo?</h2>
        <div class="botones-modal-eliminar">
            <button id="btn-aceptar-eliminar-periodo">Aceptar</button>
            <button id="btn-cancelar-eliminar-periodo">Cancelar</button>
        </div>
    </div>
</div>

    <h2 class="general-tittle2"><i class="fa-solid fa-hourglass"></i>Periodos</h2>

    <div class="cabecera-crud-periodos">
        <button id="btn-agregar-periodo" class="boton-crud-periodos">Agregar Periodo</button>
    </div>
    
    <div class="filtros-busqueda-periodos">
        <div class="contenedor-filtros-periodos">
            <input type="text" class="buscar-input-periodos" placeholder="Buscar Periodos">

            <select class="filtro-estatus-periodos">
                <option value="" disabled selected>Estatus</option>
                <option value="">Todos</option>
                <option value="Cursando">Cursando</option>
                <option value="cerrado">Cerrado</option>
            </select>
        </div>
        <div class="botones-filtro-periodos">
            <button class="boton-filtro-periodos btn-buscar-periodos">Buscar</button>
            <button class="boton-filtro-periodos btn-reajustar-periodos">Reajustar</button>
        </div>
    </div>
    
    <div class="crud-periodos">
        <main class="crud-periodos-contenedor">
            <table id="tabla-periodos">
                <thead>
                    <tr>
                        
                        <th>Nombre</th>
                        <th>Límite de UC</th>
                        <th>Fecha de Inicio</th>
                        <th>Fecha de Finalización</th>
                        <th>Estatus</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                     <!-- Las filas se llenarán dinámicamente con JavaScript -->


                </tbody>
            </table>
        </main>
    
        <div class="paginacion-crud paginacion-periodos">
            <button class="pagina-anterior-periodos"><i class="fas fa-chevron-left"></i></button>
            <div class="numeros-pagina-periodos">
                <button class="numero-pagina-periodos activo">1</button>
                <button class="numero-pagina-periodos">2</button>
            </div>
            <button class="pagina-siguiente-periodos"><i class="fas fa-chevron-right"></i></button>
            <span class="info-paginacion-periodos">1-2 de 2</span>
        </div>
    </div>
    
    
</body>
</html>
